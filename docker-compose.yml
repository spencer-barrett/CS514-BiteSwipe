services:
  db:
    image: postgres:17
    container_name: biteswipe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: biteswipe
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: biteswipe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biteswipe -d biteswipe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: